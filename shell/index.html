<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Next Bridge</title>
    <style>
      :root {
        --bg-color: #0a0a0a;
        --panel-bg: #121212;
        --accent: #f59e0b;
        --accent-hover: #fbbf24;
        --border-color: #262626;
        --text-primary: #f3f4f6;
        --text-secondary: #9ca3af;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
      }

      body {
        background-color: var(--bg-color);
        color: var(--text-primary);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: hidden;
      }

      .shell-container {
        width: 100%;
        max-width: 380px;
        background: var(--panel-bg);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 40px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
        animation: fadeIn 0.4s ease-out;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(12px); }
        to { opacity: 1; transform: translateY(0); }
      }

      .logo-wrapper {
        position: relative;
        margin-bottom: 24px;
      }

      .logo-img {
        width: 80px;
        height: 80px;
        border-radius: 20px;
        box-shadow: 0 8px 28px rgba(245, 158, 11, 0.3);
        border: 2px solid rgba(245, 158, 11, 0.4);
        display: block;
      }

      .pulse-ring {
        position: absolute;
        top: -6px;
        left: -6px;
        right: -6px;
        bottom: -6px;
        border-radius: 26px;
        border: 2px solid var(--accent);
        opacity: 0.4;
        animation: pulse 2s infinite cubic-bezier(0.4, 0, 0.6, 1);
        pointer-events: none;
      }

      @keyframes pulse {
        0%, 100% { transform: scale(1); opacity: 0.2; }
        50% { transform: scale(1.08); opacity: 0.6; }
      }

      h1 {
        font-size: 1.6rem;
        font-weight: 700;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
        color: #ffffff;
      }

      .subtitle {
        font-size: 0.875rem;
        color: var(--text-secondary);
        margin-bottom: 32px;
      }

      .progress-section {
        width: 100%;
        margin-bottom: 20px;
      }

      .progress-track {
        width: 100%;
        height: 6px;
        background: #1a1a1a;
        border-radius: 999px;
        overflow: hidden;
        border: 1px solid var(--border-color);
        margin-bottom: 14px;
        position: relative;
      }

      .progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #f59e0b, #fbbf24);
        border-radius: 999px;
        transition: width 0.25s ease-out;
      }

      .progress-fill.indeterminate {
        width: 35% !important;
        position: absolute;
        animation: indeterminate 1.5s infinite ease-in-out;
      }

      @keyframes indeterminate {
        0% { left: -35%; }
        100% { left: 100%; }
      }

      .status-label {
        font-size: 0.875rem;
        font-weight: 500;
        color: #f3f4f6;
        margin-bottom: 4px;
      }

      .detail-label {
        font-size: 0.75rem;
        color: #6b7280;
      }

      .retry-btn {
        display: none;
        margin-top: 16px;
        width: 100%;
        padding: 12px;
        background: var(--accent);
        color: #000;
        border: none;
        border-radius: 10px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s;
      }

      .retry-btn:hover {
        background: var(--accent-hover);
      }

      .footer-note {
        margin-top: 24px;
        font-size: 0.7rem;
        color: #4b5563;
        letter-spacing: 0.5px;
      }
    </style>
  </head>
  <body>
    <div class="shell-container">
      <div class="logo-wrapper">
        <img src="/favicon.png" alt="Next Bridge" class="logo-img" />
        <div class="pulse-ring"></div>
      </div>

      <h1>Next Bridge</h1>
      <p class="subtitle">Secure Learning Platform</p>

      <div class="progress-section">
        <div class="progress-track">
          <div class="progress-fill indeterminate" id="progress-bar"></div>
        </div>
        <p class="status-label" id="status-text">Connecting to update server...</p>
        <p class="detail-label" id="detail-text">Preparing latest resources</p>
      </div>

      <button id="retry-btn" class="retry-btn" onclick="startUpdate()">
        Tap to Retry
      </button>

      <p class="footer-note">NextBridge Dynamic Client v1.0</p>
    </div>

    <script type="module" src="/main.js"></script>
  </body>
</html>
