[build]
  command = "npm run build:deploy"
  publish = "deploy_dist"

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/buildcode/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
