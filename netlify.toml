[build]
  command = "npm run build:deploy"
  publish = "deploy_dist"

# VITE_ADMIN_USERNAME value is "admin" — a common word that appears naturally
# throughout component names, variable names, and UI text. It is not a secret.
# The actual secret (VITE_ADMIN_PASSWORD_HASH) remains scanned normally.
[context.production.environment]
  SECRETS_SCAN_OMIT_KEYS = "VITE_ADMIN_USERNAME"

[[redirects]]
  from = "/api/pw-static/*"
  to = "https://static.pw.live/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/pw-gateway/*"
  to = "https://nexthope-pw.space-z.ai/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/course-proxy/*"
  to = "https://course.nexttoppers.com/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/lxpdf"
  to = "https://nextbridgeapi.adsbackend01.workers.dev/api/lxpdf"
  status = 200
  force = true

[[redirects]]
  from = "/api/lxpdf/*"
  to = "https://nextbridgeapi.adsbackend01.workers.dev/api/lxpdf/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/admin/*"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/buildcode/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/api/pw-static/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, HEAD, OPTIONS"
    Access-Control-Allow-Headers = "*"
